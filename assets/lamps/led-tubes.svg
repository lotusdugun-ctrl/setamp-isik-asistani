<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1b2232"/>
      <stop offset="100%" stop-color="#0d1118"/>
    </radialGradient>
    <linearGradient id="tube1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="tube2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tube3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <g transform="rotate(-28 120 120)">
    <!-- Soft glows -->
    <rect x="64" y="26" width="16" height="188" rx="8" fill="#fbbf24" opacity="0.28" filter="url(#glow)"/>
    <rect x="96" y="20" width="16" height="200" rx="8" fill="#38bdf8" opacity="0.34" filter="url(#glow)"/>
    <rect x="128" y="24" width="16" height="192" rx="8" fill="#e879f9" opacity="0.28" filter="url(#glow)"/>
    <rect x="160" y="32" width="16" height="176" rx="8" fill="#ffffff" opacity="0.25" filter="url(#glow)"/>
    <!-- Tube 1 -->
    <rect x="65" y="34" width="14" height="172" rx="6" fill="url(#tube1)"/>
    <rect x="64" y="24" width="16" height="14" rx="3" fill="#1f2937" stroke="#475569" stroke-width="1"/>
    <rect x="64" y="202" width="16" height="14" rx="3" fill="#1f2937" stroke="#475569" stroke-width="1"/>
    <!-- Tube 2 -->
    <rect x="97" y="28" width="14" height="184" rx="6" fill="url(#tube2)"/>
    <rect x="96" y="18" width="16" height="14" rx="3" fill="#1f2937" stroke="#475569" stroke-width="1"/>
    <rect x="96" y="208" width="16" height="14" rx="3" fill="#1f2937" stroke="#475569" stroke-width="1"/>
    <!-- Tube 3 -->
    <rect x="129" y="32" width="14" height="176" rx="6" fill="url(#tube3)"/>
    <rect x="128" y="22" width="16" height="14" rx="3" fill="#1f2937" stroke="#475569" stroke-width="1"/>
    <rect x="128" y="204" width="16" height="14" rx="3" fill="#1f2937" stroke="#475569" stroke-width="1"/>
    <!-- Tube 4 -->
    <rect x="161" y="40" width="14" height="160" rx="6" fill="url(#tube1)"/>
    <rect x="160" y="30" width="16" height="14" rx="3" fill="#1f2937" stroke="#475569" stroke-width="1"/>
    <rect x="160" y="196" width="16" height="14" rx="3" fill="#1f2937" stroke="#475569" stroke-width="1"/>
    <!-- Mounting Bar -->
    <rect x="52" y="114" width="136" height="12" rx="4" fill="#111827" stroke="#475569" stroke-width="1.2"/>
    <circle cx="72" cy="120" r="3" fill="#94a3b8"/>
    <circle cx="104" cy="120" r="3" fill="#94a3b8"/>
    <circle cx="136" cy="120" r="3" fill="#94a3b8"/>
    <circle cx="168" cy="120" r="3" fill="#94a3b8"/>
  </g>
</svg>
